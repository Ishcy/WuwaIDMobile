<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WuwaIDMobile — pendamping terjemahan Bahasa Indonesia untuk Wuthering Waves. Pratinjau frontend dengan IPC simulasi."
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>WuwaIDMobile</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="confirm-dialog" aria-labelledby="dialog-title">
      <div class="dialog-icon">!</div>
      <h2 id="dialog-title">Hapus terjemahan?</h2>
      <p>
        Simulasi ini menghapus paket terjemahan dan memulihkan tampilan UID
        bawaan. File game asli dan UID akun tidak diubah.
      </p>
      <div class="actions">
        <button class="btn btn-secondary" id="cancel-uninstall">Batal</button>
        <button class="btn btn-danger" id="confirm-uninstall">
          Hapus terjemahan
        </button>
      </div>
    </dialog>
  </body>
</html>
