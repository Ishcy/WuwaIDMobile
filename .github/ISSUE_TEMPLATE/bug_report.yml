name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact steps and input used.
      placeholder: |
        1. Open the app
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Include the version and whether this is desktop or Android.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS/device, Android version if applicable, and relevant logs.
